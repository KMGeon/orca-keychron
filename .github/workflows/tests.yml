name: Test pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade ".[dev]" build
      - name: Build wheel for isolated package integration tests
        run: python -m build --wheel --outdir dist/test-wheel
      - name: Verify requirements against fresh Python and Bun test results
        env:
          GJC_TEST_WHEEL_DIR: dist/test-wheel
        run: python scripts/requirements.py --verify-tests
      - name: Run lint
        if: matrix.python-version == '3.13'
        run: python -m ruff check .
